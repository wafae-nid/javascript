<!DOCTYPE html>
<head>
    <title>dom rps</title>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="rps_result('Rock');">Rock </button>
    <button onclick="rps_result('Paper');">Paper</button>
    <button onclick="rps_result('Scissors');">scissors</button>
    <div class="result">
    </div>
    <div class="recap">
    </div>
    <div class="details">
    </div>
  <script>

    const score = {
        win:0,
        loss:0,
        tie:0
    };
     
    const recap ={
        result :'',
        pmove :'',
        ymove:''
    }
    function pc_move()
    {
        let randnbr = Math.random();
        if(randnbr<1/3)
            return('Rock');
        else if(1/3<randnbr && randnbr<2/3)
            return('Paper');
        else
           return('Scissors'); 
    }

    function rps_result(value)
    {
        let pc_move_ = pc_move();
      
        if(pc_move_ ==='Scissors')
        {
            if(value=== 'Scissors')
            {   
                recap.result = 'Tie';
                recap.pmove = pc_move_;
                recap.ymove = 'Scissors';
                score.tie += 1;
            }
            else if(value === 'Rock')
            {
                recap.result = 'You win';
                recap.pmove = pc_move_;
                recap.ymove = 'Rock';
                score.win += 1;
            }
            else
            {
                recap.result = 'You loose';
                recap.pmove = pc_move_;
                recap.ymove = 'paper';
                score.loss += 1;
            }
        }
        else if(pc_move_ === 'Rock')
        {   
            if(value=== 'Scissors')
            {
                recap.result = 'You loose';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.loss += 1;
            }
            else if(value === 'Rock')
            {
                recap.result = 'Tie';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.tie += 1;
            }
            else
            {
                recap.result = 'You win';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.win += 1;
            }
        }
        else
        {
            if(value=== 'Scissors')
            {
                recap.result = 'You win';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.win += 1;
            }
            else if(value === 'Rock')
            {
                recap.result = 'You loose';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.loss += 1;
            }
            else
            {
                recap.result = 'Tie';
                recap.pmove = pc_move_;
                recap.ymove = value;
                score.tie += 1;
            }
        }
        rps_output();
    }
    function rps_output()
    {

        const documentElem = document.querySelector('.result');
        documentElem.innerHTML=recap.result;
        const documentElem1 = document.querySelector('.recap');
        documentElem1.innerHTML = "You "+ recap.ymove + "- "+ recap.pmove +" Computer";
        const documentElem2 = document.querySelector('.details');
        documentElem2.innerHTML = "Wins: " + score.win + ", Losses: "+score.loss +", Ties:" + score.tie
    }

    </script>
</body>
</html>

<!DOCTYPE html>
<header>
    <title>wafae's DOm javascript</title>
    <link rel="stylesheet" href="style.css">
</header>
<body>
    <p>Youtube Subscribe Button</p>
    <button id=style3
    onclick="subscribe();"class="js-subscribe">subscribe</button>
  <script>

    function subscribe()
    {
        const documentElem = document.querySelector('.js-subscribe');
        if(documentElem.innerHTML === 'subscribe')
        {
            documentElem.innerHTML = 'subscribed';
            documentElem.id = 'style4';
        }
        else
        {
            documentElem.innerHTML = 'subscribe';
            documentElem.id = 'style3';
        } 
    }

    </script>
</body>
</html>

<!DOCTYPE html>
<html>
    <header>
        <title> calculator</title>
    </header>
    <body>
        <input class="calcul" placeholder="enter value here" onkeydown="typing(event)">
        </input>
        <button  onclick="calculate();">calculate</button>
        <div>
        </div>
        <script>
            function calculate()
            {
                const documentElem = document.querySelector('.calcul');
                const value_= Number(documentElem.value);
                const documentElem2 = document.querySelector('div');
                if(value_ < 50)
                    documentElem2.innerHTML = "your order is " + (value_+ 10) +"$";
                else
                    documentElem2.innerHTML = "your order is " + (value_) +"$";
            }
            function typing(event)
            {
                const documentElem = document.querySelector('.calcul');
                documentElem.placeholder ="typing..."
                if(event.key === 'Enter')
                    calculate();

            }
        </script>
    </body>
</html>
